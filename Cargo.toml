[package]
name = "rungui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"
description = "Small portable native GUI library: a thin layer over GTK3, Win32 and AppKit with hand-declared FFI"
license = "MIT OR Apache-2.0"
authors = ["Graydon Hoare <graydon@pobox.com>"]
repository = "https://github.com/graydon/rungui"
homepage = "https://github.com/graydon/rungui"
documentation = "https://docs.rs/rungui"
readme = "README.md"
keywords = ["gui", "native", "gtk", "win32", "cocoa"]
categories = ["gui", "os"]
# Keep the published crate small: no docs directory (it stays on GitHub), CI, devcontainer or helper scripts.
exclude = [".devcontainer/", ".github/", ".claude/", ".cargo/", "doc/", "scripts/"]

[features]
default = []
# Linux-hosted emulation of the macOS (Cocoa) backend: on a linux target, compile the
# Cocoa backend (cfg rungui_cocoa) against GNUstep (libgnustep-gui/base + GCC libobjc)
# instead of the GTK backend. Ignored on windows/macos targets.
emulate-mac = [
    "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit",
    "objc2/gnustep-2-1", "objc2/disable-encoding-assertions",
    "objc2-foundation/gnustep-2-1", "objc2-app-kit/gnustep-2-1",
]
# In-memory headless backend (src/backend/mock.rs) for tests/examples on any host.
mock = []

# Dual-pane file manager (examples/file_manager/); `test = true` runs its fsmodel unit tests.
[[example]]
name = "file_manager"
path = "examples/file_manager/main.rs"
test = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"

# Win32 backend: Microsoft's `windows` crate (bindings + COM interfaces); links the import libs itself.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Cocoa backend (src/backend/cocoa*): the objc2 ecosystem instead of hand-declared FFI. They link
# AppKit/Foundation/libobjc themselves. Feature lists are minimal (found by removal): every listed
# AppKit feature is used by the backend.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSTimer", "NSRunLoop", "NSProcessInfo", "NSThread",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # windows, views, controls
    "NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSCell", "NSActionCell",
    "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSSecureTextField",
    "NSText", "NSTextView", "NSTextContainer", "NSScrollView", "NSPopUpButton", "NSSlider",
    "NSProgressIndicator", "NSStepper", "NSTabView", "NSTabViewItem", "NSBox", "NSImageView",
    "NSPanel", "NSLayoutConstraint",
    # tables and outlines
    "NSTableView", "NSTableColumn", "NSTableHeaderCell", "NSTableHeaderView", "NSOutlineView",
    "NSUserInterfaceItemIdentification",
    # menus, dialogs, events, drawing
    "NSMenu", "NSMenuItem", "NSAlert", "NSOpenPanel", "NSSavePanel", "NSEvent", "NSGraphicsContext",
    "NSCursor", "NSColor", "NSFont", "NSScreen", "NSGraphics", "NSImage", "NSImageRep",
    "NSBitmapImageRep", "NSRunningApplication", "NSAccessibilityProtocols", "objc2-core-foundation",
] }

# Cocoa backend on linux (GNUstep + libobjc2) for the emulate-mac feature.
[target.'cfg(target_os = "linux")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std", "NSTimer", "NSRunLoop", "NSProcessInfo", "NSThread",
] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    # windows, views, controls
    "NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSCell", "NSActionCell",
    "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSSecureTextField",
    "NSText", "NSTextView", "NSTextContainer", "NSScrollView", "NSPopUpButton", "NSSlider",
    "NSProgressIndicator", "NSStepper", "NSTabView", "NSTabViewItem", "NSBox", "NSImageView",
    "NSPanel", "NSLayoutConstraint",
    # tables and outlines
    "NSTableView", "NSTableColumn", "NSTableHeaderCell", "NSTableHeaderView", "NSOutlineView",
    "NSUserInterfaceItemIdentification",
    # menus, dialogs, events, drawing
    "NSMenu", "NSMenuItem", "NSAlert", "NSOpenPanel", "NSSavePanel", "NSEvent", "NSGraphicsContext",
    "NSCursor", "NSColor", "NSFont", "NSScreen", "NSGraphics", "NSImage", "NSImageRep",
    "NSBitmapImageRep", "NSRunningApplication", "NSAccessibilityProtocols", "objc2-core-foundation",
] }
