[package]
name = "rungui-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# only the libFuzzer target needs it (and a C++ compiler for the target), so Win32 builds skip it
libfuzzer-sys = { version = "0.4", optional = true }
rungui = { path = ".." }

[features]
# Win32 code coverage under wine: build with the sancov trace-pc flags and link
# scripts/wincov/cov.o (see scripts/wincov.sh); the drivers then write the executed addresses out.
wincov = []
# Headless in-memory backend (for the libFuzzer target and `tests/random_ops.rs`).
mock = ["rungui/mock", "dep:libfuzzer-sys"]
# Cocoa backend on GNUstep (linux hosts).
emulate-mac = ["rungui/emulate-mac"]

[[bin]]
name = "api_mock"
path = "fuzz_targets/api_mock.rs"
test = false
doc = false
bench = false
required-features = ["mock"]

# Drives the real toolkit (GTK, GNUstep or Win32) with the same random operations; see the file.
[[bin]]
name = "native"
path = "src/bin/native.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: it needs nightly and libFuzzer.
[workspace]

# Replays a native-driver seed on the mock backend and dumps the widget tree.
[[bin]]
name = "replay_mock"
path = "src/bin/replay_mock.rs"
test = false
doc = false
bench = false
required-features = ["mock"]

# Create/destroy a window with every widget kind in a loop and report memory and fd use.
[[bin]]
name = "soak"
path = "src/bin/soak.rs"
test = false
doc = false
bench = false

# Times the real backend on big UIs (tens of thousands of rows, thousands of widgets).
[[bin]]
name = "bench_native"
path = "src/bin/bench_native.rs"
test = false
doc = false
bench = false
